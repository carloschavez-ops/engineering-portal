{% extends 'base.html' %}


{% block title %}
Agregar a carpeta
{% endblock %}



{% block content %}


<div class="form-container">


<h1 class="page-title">
Agregar "{{ app.nombre }}" a carpeta
</h1>



<form method="POST">


<div class="mb-3">

<label class="form-label">
Selecciona una carpeta
</label>


<select name="folder_id"
class="form-control"
required>

<option value="">
-- Seleccionar --
</option>

<option value="">
📂 Sin carpeta
</option>


{% for folder in folders %}

<option value="{{ folder.id }}">

📁 {{ folder.nombre }}

</option>

{% endfor %}


</select>


</div>



<button class="btn btn-accent">

<i data-feather="folder-plus"></i>

Guardar

</button>



<a href="{{ url_for('apps.list_apps') }}"
class="btn btn-ghost">

Cancelar

</a>



</form>


</div>


{% endblock %}
